<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<link rel="icon" href="data:,">
<link rel="manifest" href="/manifest.json">
<title>会议签到</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
     background:#eef2f7;color:#1f2937;font-size:16px;line-height:1.5;
     padding:16px;min-height:100vh}
.card{max-width:460px;margin:0 auto;background:#fff;border-radius:14px;
      box-shadow:0 2px 12px rgba(0,0,0,.06);padding:22px 20px 24px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:#6b7280;font-size:14px;margin:0 0 18px}
.tips{display:flex;align-items:center;gap:8px;background:#fff7ed;border:1px solid #fdba74;
      border-left:4px solid #ea580c;color:#9a3412;padding:12px 14px;border-radius:10px;
      font-size:14px;line-height:1.5;margin:0 0 18px}
.tips-icon{font-size:18px;animation:pulse 1.8s ease-in-out infinite}
.tips strong{color:#c2410c}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(1.15)}}
label{display:block;font-size:14px;color:#374151;margin:14px 0 6px;font-weight:500}
input{width:100%;padding:12px 14px;font-size:16px;border:1px solid #d1d5db;
      border-radius:10px;outline:none;background:#fff;transition:border-color .15s}
input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
button{width:100%;margin-top:22px;padding:14px;font-size:17px;font-weight:600;
       color:#fff;background:#2563eb;border:0;border-radius:10px;cursor:pointer}
button:disabled{opacity:.6}
.msg{margin-top:14px;font-size:14px;color:#dc2626;min-height:20px;text-align:center}
.ok{max-width:460px;margin:10vh auto;background:#fff;border-radius:14px;
    padding:40px 24px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.ok .tick{width:64px;height:64px;margin:0 auto 16px;border-radius:50%;
          background:#dcfce7;color:#16a34a;font-size:36px;line-height:64px}
.ok h2{margin:0 0 8px;font-size:20px}
.ok p{color:#6b7280;margin:6px 0;font-size:15px}
.footer{text-align:center;font-size:12px;color:#9ca3af;margin-top:24px;line-height:1.6}
</style>
</head>
<body>
<div class="card" id="formCard">
  <h1 id="meetingName">会议签到</h1>
  <p class="sub" id="meetingSub">正在加载会议信息…</p>
  <div class="tips">
    <span class="tips-icon">📶</span>
    <span>请使用<strong>移动网络</strong>进行签到，部分 WiFi 无法访问</span>
  </div>
  <form id="f" autocomplete="on" style="display:none">
    <div id="dynamicFields"></div>
    <label for="captcha">验证码 <span style="color:#dc2626">*</span></label>
    <div style="display:flex;gap:8px;align-items:center">
      <span id="captchaQ" style="font-size:18px;font-weight:600;color:#2563eb;min-width:90px">加载中…</span>
      <button type="button" onclick="loadCaptcha()" style="width:auto;margin-top:0;padding:6px 12px;font-size:14px;background:#6b7280">换一题</button>
    </div>
    <input id="captcha" type="number" required inputmode="numeric" placeholder="请输入计算结果" style="margin-top:8px">
    <button type="submit" id="btn">提 交 签 到</button>
    <div class="msg" id="msg"></div>
  </form>
  <div class="footer">本页面仅支持 IPv6 网络访问</div>
</div>

<script>
// 把 loadCaptcha 挂到全局，让 onclick 按钮能找到
window.loadCaptcha = function() {
  document.getElementById('captchaQ').textContent = '加载中…';
  document.getElementById('captcha').value = '';
  fetch('/api/captcha').then(r => r.json()).then(j => {
    if (j.ok) document.getElementById('captchaQ').textContent = j.question;
  }).catch(() => document.getElementById('captchaQ').textContent = '加载失败');
};

(function(){
  var params = new URLSearchParams(location.search);
  var meetingCode = params.get('m');
  var meetingId = null;
  var meetingFields = {};

  // 无会议参数：显示站点标题和副标题
  if (!meetingCode) {
    fetch('/api/config').then(r => r.json()).then(cfg => {
      document.getElementById('meetingName').textContent = cfg.siteTitle || '会议签到';
      document.getElementById('meetingSub').textContent = cfg.subtitle || '请扫描正确的二维码';
    });
    return;
  }

  fetch('/api/meeting-info?code=' + encodeURIComponent(meetingCode))
    .then(r => r.json())
    .then(j => {
      if (!j.ok) {
        document.getElementById('meetingName').textContent = '无法签到';
        document.getElementById('meetingSub').textContent = j.msg || '请联系管理员';
        return;
      }
      meetingId = j.id;
      meetingFields = j.fields || { name: true, phone: true, org: true, title: false, note: false };
      document.getElementById('meetingName').textContent = j.name;
      document.getElementById('meetingSub').textContent = '请填写以下信息完成签到';

      var html = '';
      if (meetingFields.name)  html += '<label>姓名 <span style="color:#dc2626">*</span></label><input id="name" type="text" required maxlength="50" placeholder="请输入姓名" autocomplete="name">';
      if (meetingFields.phone) html += '<label>电话 <span style="color:#dc2626">*</span></label><input id="phone" type="tel" required maxlength="11" placeholder="请输入手机号" autocomplete="tel" inputmode="tel">';
      if (meetingFields.org)   html += '<label>单位 <span style="color:#dc2626">*</span></label><input id="org" type="text" required maxlength="100" placeholder="请输入单位 / 部门" autocomplete="organization">';
      if (meetingFields.title) html += '<label>职务 <span style="color:#dc2626">*</span></label><input id="title" type="text" required maxlength="50" placeholder="请输入职务">';
      if (meetingFields.note)  html += '<label>备注</label><input id="note" type="text" maxlength="200" placeholder="选填">';
      document.getElementById('dynamicFields').innerHTML = html;

      document.getElementById('f').style.display = 'block';
      window.loadCaptcha();

      try {
        var s = JSON.parse(localStorage.getItem('signin_profile') || '{}');
        ['name','phone','org','title'].forEach(function(k){
          var el = document.getElementById(k);
          if (el && s[k]) el.value = s[k];
        });
      } catch(e) {}

      document.getElementById('f').addEventListener('submit', function(e){
        e.preventDefault();
        if (!meetingId) { document.getElementById('msg').textContent = '会议信息未加载'; return; }
        var data = { meetingId: meetingId, captcha: document.getElementById('captcha').value.trim() };
        ['name','phone','org','title','note'].forEach(function(k){
          var el = document.getElementById(k);
          if (el) data[k] = el.value.trim();
        });
        if (meetingFields.name && !data.name) { document.getElementById('msg').textContent = '请填写姓名'; return; }
        if (meetingFields.phone && !/^1\d{10}$/.test(data.phone)) { document.getElementById('msg').textContent = '手机号格式错误'; return; }
        if (meetingFields.org && !data.org) { document.getElementById('msg').textContent = '请填写单位'; return; }
        if (meetingFields.title && !data.title) { document.getElementById('msg').textContent = '请填写职务'; return; }

        var btn = document.getElementById('btn'), msg = document.getElementById('msg');
        btn.disabled = true; btn.textContent = '提交中…'; msg.textContent = '';

        fetch('/api/checkin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        })
        .then(r => r.json())
        .then(j => {
          if (j.ok) {
            try { localStorage.setItem('signin_profile', JSON.stringify(data)); } catch(e) {}
            var d = document.createElement('div');
            d.className = 'ok';
            d.innerHTML = '<div class="tick">✓</div><h2></h2><p></p><p style="font-size:13px;color:#9ca3af">可以关闭本页面了</p>';
            d.querySelector('h2').textContent = j.dup ? '您已签到过' : '签到成功';
            d.querySelector('p').textContent = (data.name || '') + '，' + (j.dup ? ('记录时间 ' + j.time) : j.time);
            document.body.innerHTML = '';
            document.body.appendChild(d);
          } else {
            msg.textContent = j.msg || '提交失败，请重试';
            btn.disabled = false; btn.textContent = '提 交 签 到';
            window.loadCaptcha();
          }
        })
        .catch(() => {
          msg.textContent = '网络异常，请重试';
          btn.disabled = false; btn.textContent = '提 交 签 到';
          window.loadCaptcha();
        });
      });
    })
    .catch(() => {
      document.getElementById('meetingName').textContent = '网络异常';
      document.getElementById('meetingSub').textContent = '请稍后重试';
    });
})();
</script>
</body>
</html>
