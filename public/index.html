<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<link rel="icon" href="data:,">
<title>会议签到</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
     background:#f2f4f8;color:#1f2937;font-size:16px;line-height:1.5;
     padding:16px;min-height:100vh}
.card{max-width:460px;margin:0 auto;background:#fff;border-radius:14px;
      box-shadow:0 2px 12px rgba(0,0,0,.06);padding:22px 20px 24px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:#6b7280;font-size:14px;margin:0 0 18px}
label{display:block;font-size:14px;color:#374151;margin:14px 0 6px;font-weight:500}
input{width:100%;padding:12px 14px;font-size:16px;border:1px solid #d1d5db;
      border-radius:10px;outline:none;background:#fff;transition:border-color .15s}
input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
button{width:100%;margin-top:22px;padding:14px;font-size:17px;font-weight:600;
       color:#fff;background:#2563eb;border:0;border-radius:10px;cursor:pointer}
button:disabled{opacity:.6}
.msg{margin-top:14px;font-size:14px;color:#dc2626;min-height:20px;text-align:center}
.ok{max-width:460px;margin:10vh auto;background:#fff;border-radius:14px;
    padding:40px 24px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.ok .tick{width:64px;height:64px;margin:0 auto 16px;border-radius:50%;
          background:#dcfce7;color:#16a34a;font-size:36px;line-height:64px}
.ok h2{margin:0 0 8px;font-size:20px}
.ok p{color:#6b7280;margin:6px 0;font-size:15px}
</style>
</head>
<body>
<div class="card" id="formCard">
  <h1 id="meetingName">会议签到</h1>
  <p class="sub" id="meetingSub">正在加载会议信息…</p>
  <form id="f" autocomplete="on" style="display:none">
    <label for="name">姓名 <span style="color:#dc2626">*</span></label>
    <input id="name" type="text" required maxlength="50" placeholder="请输入姓名" autocomplete="name">
    <label for="phone">电话 <span style="color:#dc2626">*</span></label>
    <input id="phone" type="tel" required maxlength="11" placeholder="请输入手机号" autocomplete="tel" inputmode="tel">
    <label for="org">单位 <span style="color:#dc2626">*</span></label>
    <input id="org" type="text" required maxlength="100" placeholder="请输入单位 / 部门" autocomplete="organization">
    <label for="note">备注</label>
    <input id="note" type="text" maxlength="200" placeholder="选填">
    <button type="submit" id="btn">提 交 签 到</button>
    <div class="msg" id="msg"></div>
  </form>
</div>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var meetingCode = params.get('m');
  var meetingId = null;

  if (!meetingCode) {
    document.getElementById('meetingName').textContent = '无效的会议链接';
    document.getElementById('meetingSub').textContent = '请扫描正确的二维码';
    return;
  }

  // 会议校验：询问服务器该会议是否存在
  fetch('/api/meeting-info?code=' + encodeURIComponent(meetingCode))
    .then(r => r.json())
    .then(j => {
      if (!j.ok) {
        document.getElementById('meetingName').textContent = '会议不存在';
        document.getElementById('meetingSub').textContent = j.msg || '请联系管理员';
        return;
      }
      meetingId = j.id;
      document.getElementById('meetingName').textContent = j.name;
      document.getElementById('meetingSub').textContent = '请填写以下信息完成签到';
      document.getElementById('f').style.display = 'block';
    })
    .catch(() => {
      document.getElementById('meetingName').textContent = '网络异常';
      document.getElementById('meetingSub').textContent = '请稍后重试';
    });

  var f = document.getElementById('f'), btn = document.getElementById('btn'), msg = document.getElementById('msg');
  var $ = id => document.getElementById(id);

  try {
    var s = JSON.parse(localStorage.getItem('signin_profile') || '{}');
    if (s.name) $('name').value = s.name;
    if (s.phone) $('phone').value = s.phone;
    if (s.org) $('org').value = s.org;
  } catch(e) {}

  f.addEventListener('submit', function(e){
    e.preventDefault();
    if (!meetingId) { msg.textContent = '会议信息未加载'; return; }
    var data = {
      meetingId: meetingId,
      name: $('name').value.trim(),
      phone: $('phone').value.trim(),
      org: $('org').value.trim(),
      note: $('note').value.trim()
    };
    if (!data.name || !data.phone || !data.org) { msg.textContent = '请填写完整信息'; return; }
    btn.disabled = true; btn.textContent = '提交中…'; msg.textContent = '';

    fetch('/api/checkin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    })
    .then(r => r.json())
    .then(j => {
      if (j.ok) {
        try { localStorage.setItem('signin_profile', JSON.stringify(data)); } catch(e) {}
        var t = j.time || '';
        var d = document.createElement('div');
        d.className = 'ok';
        d.innerHTML = '<div class="tick">✓</div><h2></h2><p></p><p style="font-size:13px;color:#9ca3af">可以关闭本页面了</p>';
        d.querySelector('h2').textContent = j.dup ? '您已签到过' : '签到成功';
        d.querySelector('p').textContent = data.name + '，' + (j.dup ? ('记录时间 ' + t) : t);
        document.body.innerHTML = '';
        document.body.appendChild(d);
      } else {
        msg.textContent = j.msg || '提交失败，请重试';
        btn.disabled = false; btn.textContent = '提 交 签 到';
      }
    })
    .catch(() => {
      msg.textContent = '网络异常，请重试';
      btn.disabled = false; btn.textContent = '提 交 签 到';
    });
  });
})();
</script>
</body>
</html>
